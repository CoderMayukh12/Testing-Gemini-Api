<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WSP ChatBot</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        #response {
            margin-top: 20px;
            padding: 10px;
            min-height: 50px;
        }

        /* Additional styles */
    </style>
</head>

<body>
    <div class="container">
        <h2>Free ChatBot Using gemini-2 by Mayukh</h2>
        <div class="form-group">
            <input type="text" class="form-control" id="userInput" placeholder="Enter your question" />
        </div>
        <button class="btn btn-success" onclick="sendMessage()">Ask!</button>
        <div id="response"></div>
    </div>
    <script>
        async function sendMessage() {
            const input = document.getElementById("userInput").value;
            const responseDiv = document.getElementById("response");

            if (!input) {
                responseDiv.innerHTML = "Please enter a message.";
                return;
            }

            responseDiv.innerHTML = "Loading...";

            try {
                // Use the URL of your deployed serverless function once deployed
                const response = await fetch("https://testing-gemini-api.vercel.app/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: input })
                });

                const data = await response.json();
                responseDiv.innerHTML = data.choices?.[0]?.message?.content || "No response received.";
            } catch (error) {
                responseDiv.innerHTML = "Error: " + error.message;
            }
        }
    </script>
</body>

</html>
